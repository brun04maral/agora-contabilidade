{% extends "admin/change_list.html" %}
{% load i18n static %}

{% block object-tools %}
<div style="display: flex; gap: 0.5rem; align-items: center;">
    <!-- Botão Criar Relatório Personalizado -->
    <a href="{% url 'admin:core_projeto_relatorio' %}" style="
        background-color: rgb(59, 130, 246);
        color: white;
        padding: 0.5rem 1rem;
        border-radius: 0.375rem;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.875rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.2s;
    " onmouseover="this.style.backgroundColor='rgb(29, 78, 216)'" onmouseout="this.style.backgroundColor='rgb(59, 130, 246)'">
        📊 Criar Relatório
    </a>

    <!-- Botões padrão do Django Admin (Adicionar Projeto, etc) -->
    {{ block.super }}
</div>
{% endblock %}
