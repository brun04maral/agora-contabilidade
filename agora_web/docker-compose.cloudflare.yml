services:
  db:
    image: postgres:16-alpine
    container_name: agora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agora_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agora_web
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      - ./static:/app/static
      - ./media:/app/media
      - staticfiles:/app/staticfiles
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      DEBUG: ${DEBUG}
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - agora_internal
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # HTTP Router (Cloudflare Full mode envia HTTPS também)
      - "traefik.http.routers.agora-app-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.agora-app-http.entrypoints=http"
      - "traefik.http.routers.agora-app-http.service=agora-app"

      # HTTPS Router
      - "traefik.http.routers.agora-app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.agora-app.entrypoints=https"
      - "traefik.http.routers.agora-app.tls=true"
      - "traefik.http.routers.agora-app.tls.certresolver=http"
      - "traefik.http.routers.agora-app.service=agora-app"

      # Service
      - "traefik.http.services.agora-app.loadbalancer.server.port=8000"

networks:
  agora_internal:
    driver: bridge
  traefik_proxy:
    external: true

volumes:
  postgres_data:
    driver: local
  staticfiles:
    driver: local
