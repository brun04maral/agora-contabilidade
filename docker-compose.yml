services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agora_web
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # 5433 para não conflitar com prototype
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./agora_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./agora_web:/app
      - ./excel:/app/excel
    ports:
      - "8001:8000"  # 8001 para não conflitar com prototypes
    environment:
      DB_NAME: agora_web
      DB_USER: agora
      DB_PASSWORD: agora123
      DB_HOST: db
      DB_PORT: 5432
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "*"
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agora-web.rule=Host(`app.agoramediaproduction.pt`)"
      - "traefik.http.routers.agora-web.entrypoints=websecure"
      - "traefik.http.routers.agora-web.tls=true"
      - "traefik.http.routers.agora-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.agora-web.loadbalancer.server.port=8000"
    networks:
      - traefik-public
      - default

networks:
  traefik-public:
    external: true

volumes:
  postgres_data:
